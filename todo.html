<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero's Task Journey</title>
  <!-- Chart.js for visualization -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <!-- Three.js for 3D effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      --accent-color: #4a90e2;
      --text-color: #333;
      --light-text: #555;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      height: 100vh;
      overflow-x: hidden;
      color: var(--text-color);
    }

    #theme-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    #app {
      position: relative;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .content-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 0;
      color: var(--text-color);
      font-size: 1.8rem;
      font-weight: 700;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .chart-container {
      background: var(--glass-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 15px;
      border: 1px solid var(--glass-border);
      padding: 15px;
      box-shadow: var(--glass-shadow);
      height: 200px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 15px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--glass-border);
    }

    th {
      background: var(--accent-color);
      color: white;
      font-weight: 500;
    }

    .priority-Top {
      background-color: rgba(255, 200, 200, 0.7);
    }
    
    .priority-Mid {
      background-color: rgba(255, 224, 178, 0.7);
    }
    
    .priority-Low {
      background-color: rgba(255, 249, 196, 0.7);
    }
    
    .priority-Daily {
      background-color: rgba(200, 230, 201, 0.7);
    }

    .progress-cell {
      width: 120px;
    }

    .progress-bar {
      height: 8px;
      background-color: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-value {
      height: 100%;
      background-color: var(--accent-color);
      transition: width 0.3s ease;
    }

    .btn {
      background: var(--accent-color);
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      margin-right: 5px;
      transition: all 0.3s;
      font-weight: 500;
    }

    .btn:hover { 
      background: #357ab8; 
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .btn-delete {
      background: #e94e77;
    }

    .btn-delete:hover {
      background: #d33d66;
    }

    .story-box {
      background: var(--accent-color);
      color: #fff;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: 500;
    }

    .input-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
      background: var(--glass-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 15px;
      border: 1px solid var(--glass-border);
      padding: 15px;
    }

    input, select, textarea {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: rgba(255, 255, 255, 0.9);
      width: 100%;
      box-sizing: border-box;
    }

    .complete { 
      text-decoration: line-through; 
      color: #999; 
    }

    .task-notes {
      display: none;
      padding: 10px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      margin-top: 5px;
      white-space: pre-wrap;
    }

    .task-row {
      transition: all 0.3s ease;
    }

    .note-toggle {
      cursor: pointer;
      color: var(--accent-color);
      text-decoration: underline;
      font-size: 0.9em;
    }

    .completed-section {
      margin-top: 30px;
    }

    @media (max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      
      .input-group {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div id="theme-container"></div>
  
  <div id="app">
    <div class="content-wrapper">
      <h1>Hero's Task Journey</h1>
      
      <div class="story-box" id="story">Welcome, Hero! Ready to conquer your tasks?</div>
      
      <div class="dashboard">
        <div class="chart-container">
          <canvas id="weeklyChart"></canvas>
        </div>
        <div class="chart-container">
          <canvas id="progressChart"></canvas>
        </div>
      </div>
      
      <div class="input-group">
        <input type="date" id="start" placeholder="Start Date" />
        <input type="date" id="end" placeholder="End Date" />
        <select id="priority">
          <option value="Top">Top Priority</option>
          <option value="Mid">Mid Priority</option>
          <option value="Low">Low Priority</option>
          <option value="Daily">Daily Task</option>
        </select>
        <input type="text" id="text" placeholder="New Task..." />
        <button class="btn" id="addBtn">Add Task</button>
      </div>
      
      <table>
        <thead>
          <tr>
            <th>Priority</th>
            <th>Task</th>
            <th>Timeline</th>
            <th>Progress</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="tasks"></tbody>
      </table>
      
      <div class="completed-section">
        <h2>Completed Tasks</h2>
        <table>
          <thead>
            <tr>
              <th>Priority</th>
              <th>Task</th>
              <th>Timeline</th>
              <th>Completed</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="completed-tasks"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    /**
     * Theme generator for creating dynamic backgrounds
     */
    class ThemeGenerator {
      constructor() {
        this.container = document.getElementById('theme-container');
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        this.themes = [
          { name: 'sunset', colors: ['#FF7E5F', '#FEB47B', '#FFD166'] },
          { name: 'ocean', colors: ['#4CA1AF', '#2C3E50', '#5ABEFF'] },
          { name: 'forest', colors: ['#134E5E', '#71B280', '#A9C8AC'] },
          { name: 'lavender', colors: ['#8E2DE2', '#4A00E0', '#B58FDE'] },
          { name: 'coral', colors: ['#FF8177', '#FF867A', '#FF8C7F'] }
        ];
        
        this.currentTheme = null;
        this.objects = [];
        this.setupRenderer();
        this.createScene();
        this.animate();
        
        // Change theme daily
        this.setDailyTheme();
        
        // Handle window resize
        window.addEventListener('resize', () => this.onWindowResize());
      }
      
      setupRenderer() {
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setClearColor(0x000000, 0);
        this.container.appendChild(this.renderer.domElement);
        this.camera.position.z = 30;
      }
      
      createScene() {
        // Create subtle floating objects in the background
        for (let i = 0; i < 15; i++) {
          const geometry = this.getRandomGeometry();
          const material = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.1 + Math.random() * 0.2
          });
          
          const object = new THREE.Mesh(geometry, material);
          
          // Position randomly
          object.position.x = (Math.random() - 0.5) * 50;
          object.position.y = (Math.random() - 0.5) * 50;
          object.position.z = (Math.random() - 0.5) * 30;
          
          // Add some properties for animation
          object.rotationSpeed = {
            x: (Math.random() - 0.5) * 0.01,
            y: (Math.random() - 0.5) * 0.01,
            z: (Math.random() - 0.5) * 0.01
          };
          
          object.floatSpeed = {
            x: (Math.random() - 0.5) * 0.05,
            y: (Math.random() - 0.5) * 0.05
          };
          
          this.scene.add(object);
          this.objects.push(object);
        }
      }
      
      getRandomGeometry() {
        const types = [
          () => new THREE.SphereGeometry(1 + Math.random() * 2, 16, 16),
          () => new THREE.BoxGeometry(1 + Math.random() * 3, 1 + Math.random() * 3, 1 + Math.random() * 3),
          () => new THREE.TorusGeometry(2 + Math.random() * 2, 0.5, 16, 50),
          () => new THREE.OctahedronGeometry(1 + Math.random() * 2)
        ];
        
        return types[Math.floor(Math.random() * types.length)]();
      }
      
      setDailyTheme() {
        // Get a theme based on the day
        const dateKey = new Date().toISOString().split('T')[0];
        const dayNum = new Date().getDay();
        
        // Make sure we change themes if it's a new day
        const savedDateKey = localStorage.getItem('themeDate');
        
        if (savedDateKey !== dateKey) {
          // New day, new theme
          localStorage.setItem('themeDate', dateKey);
          this.currentTheme = this.themes[dayNum % this.themes.length];
          
          // Create gradient from theme colors
          const color1 = this.currentTheme.colors[0];
          const color2 = this.currentTheme.colors[1];
          const color3 = this.currentTheme.colors.length > 2 ? this.currentTheme.colors[2] : color2;
          
          document.body.style.background = `linear-gradient(135deg, ${color1}, ${color2}, ${color3})`;
          
          // Update accent color for the app
          document.documentElement.style.setProperty('--accent-color', this.currentTheme.colors[0]);
          
          // Update object colors
          this.objects.forEach((obj, i) => {
            obj.material.color.set(this.currentTheme.colors[i % this.currentTheme.colors.length]);
          });
        } else if (!this.currentTheme) {
          // Same day but page refresh
          this.currentTheme = this.themes[dayNum % this.themes.length];
          document.body.style.background = `linear-gradient(135deg, ${this.currentTheme.colors[0]}, ${this.currentTheme.colors[1]}, ${this.currentTheme.colors[2] || this.currentTheme.colors[1]})`;
          document.documentElement.style.setProperty('--accent-color', this.currentTheme.colors[0]);
          
          this.objects.forEach((obj, i) => {
            obj.material.color.set(this.currentTheme.colors[i % this.currentTheme.colors.length]);
          });
        }
      }
      
      animate() {
        requestAnimationFrame(() => this.animate());
        
        // Animate all objects
        this.objects.forEach(obj => {
          // Rotate
          obj.rotation.x += obj.rotationSpeed.x;
          obj.rotation.y += obj.rotationSpeed.y;
          obj.rotation.z += obj.rotationSpeed.z;
          
          // Float
          obj.position.x += obj.floatSpeed.x;
          obj.position.y += obj.floatSpeed.y;
          
          // Boundary check
          if (Math.abs(obj.position.x) > 40) obj.floatSpeed.x *= -1;
          if (Math.abs(obj.position.y) > 40) obj.floatSpeed.y *= -1;
        });
        
        this.renderer.render(this.scene, this.camera);
      }
      
      onWindowResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }
    }

    /**
     * Task Manager for handling task operations
     */
    class TaskManager {
      constructor() {
        this.tasks = [];
        this.weeklyScores = Array(7).fill(0);
        this.progressData = {
          completed: 0,
          pending: 0,
          overdue: 0
        };
        
        // DOM Elements
        this.tasksEl = document.getElementById('tasks');
        this.completedTasksEl = document.getElementById('completed-tasks');
        this.storyEl = document.getElementById('story');
        this.startInput = document.getElementById('start');
        this.endInput = document.getElementById('end');
        this.textInput = document.getElementById('text');
        this.priorityInput = document.getElementById('priority');
        this.addBtn = document.getElementById('addBtn');
        
        // Charts
        this.weeklyChart = null;
        this.progressChart = null;
        
        // Set today's date as default for start field
        const today = new Date().toISOString().split('T')[0];
        this.startInput.value = today;
        
        // Initialize
        this.loadTasks();
        this.setupEvents();
        this.renderTasks();
        this.initCharts();
      }
      
      /**
       * Initialize event listeners
       */
      setupEvents() {
        this.addBtn.onclick = () => this.addTask();
        
        // Auto-update end date if not set
        this.startInput.addEventListener('change', () => {
          if (!this.endInput.value) {
            const startDate = new Date(this.startInput.value);
            startDate.setDate(startDate.getDate() + 1);
            this.endInput.value = startDate.toISOString().split('T')[0];
          }
        });
      }
      
      /**
       * Load tasks from storage or initialize
       */
      loadTasks() {
        // Try to load from localStorage
        let savedTasks = localStorage.getItem('hero-tasks');
        
        if (savedTasks) {
          try {
            this.tasks = JSON.parse(savedTasks);
          } catch (e) {
            console.error("Error loading tasks:", e);
            this.tasks = [];
          }
        } else {
          // For GitHub Pages, check if we have a tasks.json file
          this.checkForGitHubData();
        }
      }
      
      /**
       * Check for GitHub stored data
       */
      checkForGitHubData() {
        // Try to fetch tasks.json if it exists
        fetch('tasks.json')
          .then(response => {
            if (response.ok) {
              return response.json();
            }
            throw new Error('No saved tasks found');
          })
          .then(data => {
            this.tasks = data;
            this.renderTasks();
            this.updateCharts();
          })
          .catch(error => {
            console.log('Using default empty tasks list:', error);
          });
      }
      
      /**
       * Save tasks to storage
       */
      saveTasks() {
        localStorage.setItem('hero-tasks', JSON.stringify(this.tasks));
        
        // Create a downloadable JSON file for GitHub Pages
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.tasks));
        
        // Update download link if exists, otherwise create it
        let downloadEl = document.getElementById('download-tasks');
        if (!downloadEl) {
          downloadEl = document.createElement('a');
          downloadEl.id = 'download-tasks';
          downloadEl.style.display = 'none';
          document.body.appendChild(downloadEl);
        }
        
        downloadEl.setAttribute("href", dataStr);
        downloadEl.setAttribute("download", "tasks.json");
        
        // Show helper message
        const msg = document.createElement('div');
        msg.style.position = 'fixed';
        msg.style.bottom = '20px';
        msg.style.left = '50%';
        msg.style.transform = 'translateX(-50%)';
        msg.style.padding = '10px 20px';
        msg.style.background = 'rgba(0,0,0,0.7)';
        msg.style.color = 'white';
        msg.style.borderRadius = '5px';
        msg.textContent = 'Tasks saved! For GitHub Pages, download the JSON file and upload to your repository.';
        msg.style.zIndex = '1000';
        
        const closeBtn = document.createElement('button');
        closeBtn.textContent = '×';
        closeBtn.style.marginLeft = '10px';
        closeBtn.style.background = 'transparent';
        closeBtn.style.border = 'none';
        closeBtn.style.color = 'white';
        closeBtn.style.cursor = 'pointer';
        closeBtn.onclick = () => document.body.removeChild(msg);
        
        const downloadBtn = document.createElement('button');
        downloadBtn.textContent = 'Download tasks.json';
        downloadBtn.style.marginLeft = '10px';
        downloadBtn.style.background = '#4a90e2';
        downloadBtn.style.border = 'none';
        downloadBtn.style.padding = '5px 10px';
        downloadBtn.style.borderRadius = '5px';
        downloadBtn.style.color = 'white';
        downloadBtn.style.cursor = 'pointer';
        downloadBtn.onclick = () => {
          downloadEl.click();
          document.body.removeChild(msg);
        };
        
        msg.appendChild(downloadBtn);
        msg.appendChild(closeBtn);
        document.body.appendChild(msg);
        
        // Auto-hide after 5 seconds
        setTimeout(() => {
          if (document.body.contains(msg)) {
            document.body.removeChild(msg);
          }
        }, 5000);
      }
      
      /**
       * Add a new task
       */
      addTask() {
        if (!this.textInput.value) return;
        
        this.tasks.push({
          id: Date.now().toString(),
          start: this.startInput.value,
          end: this.endInput.value,
          text: this.textInput.value,
          priority: this.priorityInput.value,
          done: false,
          notes: "",
          completedDate: null
        });
        
        this.startInput.value = new Date().toISOString().split('T')[0];
        this.endInput.value = "";
        this.textInput.value = "";
        this.renderTasks();
      }
      
      /**
       * Toggle task completion status
       * @param {string} id - Task ID
       */
      toggleTask(id) {
        const task = this.tasks.find(t => t.id === id);
        if (task) {
          task.done = !task.done;
          
          if (task.done) {
            task.completedDate = new Date().toISOString().split('T')[0];
            this.updateScore(task);
          } else {
            task.completedDate = null;
          }
          
          this.renderTasks();
        }
      }
      
      /**
       * Update score based on task completion time
       * @param {Object} task - Task object
       */
      updateScore(task) {
        if (!task.done) return;
        
        const today = new Date();
        const endDate = new Date(task.end);
        const daysDiff = Math.floor((today - endDate) / (1000 * 60 * 60 * 24));
        
        let score = 1; // Default score for completion
        
        if (daysDiff < 0) {
          // Completed early
          score = 2;
        } else if (daysDiff > 0) {
          // Completed late
          score = -1;
        }
        
        // Update weekly score
        const dayOfWeek = today.getDay();
        this.weeklyScores[dayOfWeek] += score;
        
        // Save scores
        localStorage.setItem('weekly-scores', JSON.stringify(this.weeklyScores));
      }
      
      /**
       * Remove a task
       * @param {string} id - Task ID
       */
      removeTask(id) {
        this.tasks = this.tasks.filter(t => t.id !== id);
        this.renderTasks();
      }
      
      /**
       * Toggle notes visibility
       * @param {string} id - Task ID
       */
      toggleNotes(id) {
        const notesEl = document.getElementById(`notes-${id}`);
        if (notesEl) {
          const isDisplayed = notesEl.style.display === 'block';
          notesEl.style.display = isDisplayed ? 'none' : 'block';
          
          if (!isDisplayed) {
            const inputEl = document.getElementById(`notes-input-${id}`);
            if (inputEl) {
              inputEl.focus();
            }
          }
        }
      }
      
      /**
       * Save notes for a task
       * @param {string} id - Task ID
       * @param {string} notes - Notes content
       */
      saveNotes(id, notes) {
        const task = this.tasks.find(t => t.id === id);
        if (task) {
          task.notes = notes;
          this.saveTasks();
        }
      }
      
      /**
       * Calculate task progress percentage
       * @param {Object} task - Task object
       * @returns {number} - Progress percentage
       */
      calculateProgress(task) {
        if (task.done) return 100;
        if (!task.start || !task.end) return 0;
        
        const start = new Date(task.start);
        const end = new Date(task.end);
        const today = new Date();
        
        // Check if task is in the future
        if (today < start) return 0;
        
        // Check if task is overdue
        if (today > end) return 100;
        
        // Calculate progress
        const totalDuration = end - start;
        const elapsedDuration = today - start;
        
        if (totalDuration <= 0) return 0;
        
        return Math.min(100, Math.floor((elapsedDuration / totalDuration) * 100));
      }
      
      /**
       * Render all tasks to DOM
       */
      renderTasks() {
        // Sort tasks: non-completed first, then by priority and date
        const sortedTasks = [...this.tasks].sort((a, b) => {
          // First by completion status
          if (a.done !== b.done) return a.done ? 1 : -1;
          
          // Then by priority
          const priorityOrder = { 'Top': 0, 'Mid': 1, 'Low': 2, 'Daily': 3 };
          if (priorityOrder[a.priority] !== priorityOrder[b.priority]) {
            return priorityOrder[a.priority] - priorityOrder[b.priority];
          }
          
          // Finally by end date
          return new Date(a.end) - new Date(b.end);
        });
        
        // Separate active and completed tasks
        const activeTasks = sortedTasks.filter(t => !t.done);
        const completedTasks = sortedTasks.filter(t => t.done);
        
        // Update active tasks table
        this.tasksEl.innerHTML = '';
        activeTasks.forEach(task => {
          const progress = this.calculateProgress(task);
          const tr = document.createElement('tr');
          tr.className = `task-row priority-${task.priority}`;
          tr.dataset.id = task.id;
          
          tr.innerHTML = `
            <td><span class="priority-tag">${task.priority}</span></td>
            <td>${task.text}</td>
            <td>${task.start || '-'} to ${task.end || '-'}</td>
            <td class="progress-cell">
              <div class="progress-bar">
                <div class="progress-value" style="width: ${progress}%"></div>
              </div>
              <div style="font-size: 0.8em; text-align: center;">${progress}%</div>
            </td>
            <td>
              <button class="btn" onclick="taskManager.toggleTask('${task.id}')">Complete</button>
              <button class="btn btn-delete" onclick="taskManager.removeTask('${task.id}')">Delete</button>
              <div class="note-toggle" onclick="taskManager.toggleNotes('${task.id}')">Notes</div>
              <div id="notes-${task.id}" class="task-notes">
                <textarea id="notes-input-${task.id}" rows="3" 
                  placeholder="Add notes here..."
                  onblur="taskManager.saveNotes('${task.id}', this.value)">${task.notes || ''}</textarea>
              </div>
            </td>
          `;
          
          this.tasksEl.appendChild(tr);
        });
        
        // Update completed tasks table
        this.completedTasksEl.innerHTML = '';
        completedTasks.forEach(task => {
          const tr = document.createElement('tr');
          tr.className = `task-row priority-${task.priority}`;
          tr.dataset.id = task.id;
          
          tr.innerHTML = `
            <td><span class="priority-tag">${task.priority}</span></td>
            <td class="complete">${task.text}</td>
            <td>${task.start || '-'} to ${task.end || '-'}</td>
            <td>${task.completedDate || 'Completed'}</td>
            <td>
              <button class="btn" onclick="taskManager.toggleTask('${task.id}')">Undo</button>
              <button class="btn btn-delete" onclick="taskManager.removeTask('${task.id}')">Delete</button>
              <div class="note-toggle" onclick="taskManager.toggleNotes('${task.id}')">Notes</div>
              <div id="notes-${task.id}" class="task-notes">
                <textarea id="notes-input-${task.id}" rows="3" 
                  placeholder="Add notes here..."
                  onblur="taskManager.saveNotes('${task.id}', this.value)">${task.notes || ''}</textarea>
              </div>
            </td>
          `;
          
          this.completedTasksEl.appendChild(tr);
        });
        
        // Update story message
        const remaining = activeTasks.length;
        const completed = completedTasks.length;
        
        let storyMessage = '';
        if (remaining === 0 && completed === 0) {
          storyMessage = 'Welcome, Hero! Add your first task to begin your journey!';
        } else if (remaining === 0) {
          storyMessage = `All done! Enjoy your victory, Hero!`;
        } else {
          storyMessage = `You have ${remaining} task${remaining > 1 ? 's' : ''} remaining. Keep going!`;
        }
        
        this.storyEl.textContent = storyMessage;
        
        // Persist & refresh visuals
        this.saveTasks();
        this.updateCharts();
      }
      
      /**
       * Initialize Chart.js charts
       */
      initCharts() {
        const weeklyCtx = document.getElementById('weeklyChart').getContext('2d');
        this.weeklyChart = new Chart(weeklyCtx, {
          type: 'bar',
          data: {
            labels: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
            datasets: [{
              label: 'Score',
              backgroundColor: 'var(--accent-color)',
              data: this.weeklyScores
            }]
          },
          options: { responsive: true, plugins: { legend: { display: false } } }
        });

        const progressCtx = document.getElementById('progressChart').getContext('2d');
        this.progressChart = new Chart(progressCtx, {
          type: 'doughnut',
          data: {
            labels: ['Completed', 'Pending', 'Overdue'],
            datasets: [{
              backgroundColor: ['#4a90e2', '#feb47b', '#e94e77'],
              data: [this.progressData.completed, this.progressData.pending, this.progressData.overdue]
            }]
          },
          options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });
      }

      /**
       * Recompute progressData & weeklyScores, then redraw charts
       */
      updateCharts() {
        // recompute progressData
        const today = new Date();
        this.progressData.completed = this.tasks.filter(t => t.done).length;
        this.progressData.pending = this.tasks.filter(t => !t.done && new Date(t.end) >= today).length;
        this.progressData.overdue = this.tasks.filter(t => !t.done && new Date(t.end) < today).length;

        // reload weekly scores from storage
        this.weeklyScores = JSON.parse(localStorage.getItem('weekly-scores')) || this.weeklyScores;

        // update chart datasets
        this.weeklyChart.data.datasets[0].data = this.weeklyScores;
        this.weeklyChart.update();

        this.progressChart.data.datasets[0].data = [
          this.progressData.completed,
          this.progressData.pending,
          this.progressData.overdue
        ];
        this.progressChart.update();
      }
    }

    // Kick off the app
    window.addEventListener('DOMContentLoaded', () => {
      window.taskManager = new TaskManager();
      window.themeGenerator = new ThemeGenerator();
    });
  </script>
</body>
</html>
