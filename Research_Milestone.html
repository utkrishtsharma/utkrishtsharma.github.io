<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Library - GitHub DB</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #e8e5d8; --paper: #f5f3eb; --text: #2a2825;
            --text-light: #6a6865; --border: #c8c5b8; --accent: #4a4845;
            --shadow: rgba(0, 0, 0, 0.08);
        }
        body {
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px);
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .panel {
            background: var(--paper);
            border: 2px solid var(--border);
            box-shadow: 4px 4px 0 var(--shadow);
            padding: 30px;
            margin-bottom: 20px;
        }
        header {
            border-bottom: 3px double var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .top-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
        }
        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid var(--border);
            background: white;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .btn {
            padding: 12px 25px;
            border: 2px solid var(--accent);
            background: var(--paper);
            color: var(--accent);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: var(--accent);
            color: var(--paper);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 2px solid var(--border);
        }
        th {
            background: var(--accent);
            color: var(--paper);
            padding: 12px 15px;
            text-align: left;
            font-weight: bold;
            text-transform: uppercase;
        }
        td {
            padding: 12px 15px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }
        tr:nth-child(even) { background: var(--paper); }
        tr:hover { background: #fff8e8; }
        .link-cell {
            color: #2563eb;
            text-decoration: underline;
            cursor: pointer;
        }
        .icon-btn {
            padding: 5px 10px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            margin-right: 5px;
        }
        .icon-btn:hover {
            background: var(--accent);
            color: white;
        }
        .status {
            padding: 8px;
            background: #e8f5e9;
            border-left: 3px solid #4caf50;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }
        .status.error {
            background: #ffebee;
            border-color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel">
            <header>
                <h1>Research Archive</h1>
                <p style="color: var(--text-light); font-style: italic;">GitHub-Powered Database</p>
            </header>

            <div id="statusBar"></div>

            <div class="top-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="Search papers...">
                <button class="btn" onclick="addPaper()">+ Add</button>
                <button class="btn" onclick="exportData()">Export</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width: 30%">Name</th>
                        <th style="width: 45%">About</th>
                        <th style="width: 15%">Link</th>
                        <th style="width: 10%">Actions</th>
                    </tr>
                </thead>
                <tbody id="papersBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // GitHub Configuration - Replace with your repository details
        const GITHUB_CONFIG = {
            owner: 'YOUR_USERNAME',
            repo: 'YOUR_REPO',
            path: 'data/papers.json',
            branch: 'main',
            token: 'ghp_\u200BYour\u200BToken\u200BHere'.replace(/\u200B/g, '') // Personal Access Token
        };

        let papers = [];
        let useLocal = GITHUB_CONFIG.owner === 'YOUR_USERNAME';

        function showStatus(message, isError = false) {
            const status = document.getElementById('statusBar');
            status.className = 'status' + (isError ? ' error' : '');
            status.textContent = message;
            setTimeout(() => status.textContent = '', 3000);
        }

        async function loadFromGitHub() {
            try {
                const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    const content = atob(data.content);
                    papers = JSON.parse(content);
                    localStorage.setItem('papers_cache', JSON.stringify(papers));
                    localStorage.setItem('github_sha', data.sha);
                    showStatus('✓ Loaded from GitHub');
                } else {
                    throw new Error('Failed to load');
                }
            } catch (error) {
                console.error('GitHub load error:', error);
                const cached = localStorage.getItem('papers_cache');
                papers = cached ? JSON.parse(cached) : [];
                showStatus('Using local cache', true);
            }
        }

        async function saveToGitHub() {
            if (useLocal) {
                localStorage.setItem('papers_local', JSON.stringify(papers));
                return;
            }

            try {
                const sha = localStorage.getItem('github_sha');
                const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;
                
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${GITHUB_CONFIG.token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Update research papers',
                        content: btoa(JSON.stringify(papers, null, 2)),
                        sha: sha,
                        branch: GITHUB_CONFIG.branch
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('github_sha', data.content.sha);
                    localStorage.setItem('papers_cache', JSON.stringify(papers));
                    showStatus('✓ Saved to GitHub');
                } else {
                    throw new Error('Save failed');
                }
            } catch (error) {
                console.error('GitHub save error:', error);
                localStorage.setItem('papers_cache', JSON.stringify(papers));
                showStatus('Saved locally only', true);
            }
        }

        async function loadData() {
            if (useLocal) {
                const local = localStorage.getItem('papers_local');
                papers = local ? JSON.parse(local) : [];
                showStatus('Using local storage mode');
            } else {
                await loadFromGitHub();
            }
            renderTable();
        }

        function addPaper() {
            const name = prompt('Paper name:');
            if (!name) return;
            const about = prompt('About:');
            if (!about) return;
            const link = prompt('Link (URL):');
            if (!link) return;

            papers.unshift({
                id: Date.now(),
                name,
                about,
                link,
                dateAdded: new Date().toISOString()
            });

            saveToGitHub();
            renderTable();
        }

        function editPaper(id) {
            const paper = papers.find(p => p.id === id);
            const name = prompt('Paper name:', paper.name);
            if (name === null) return;
            const about = prompt('About:', paper.about);
            if (about === null) return;
            const link = prompt('Link:', paper.link);
            if (link === null) return;

            paper.name = name;
            paper.about = about;
            paper.link = link;

            saveToGitHub();
            renderTable();
        }

        function deletePaper(id) {
            if (!confirm('Delete this paper?')) return;
            papers = papers.filter(p => p.id !== id);
            saveToGitHub();
            renderTable();
        }

        function renderTable(searchTerm = '') {
            const tbody = document.getElementById('papersBody');
            let filtered = papers;

            if (searchTerm) {
                filtered = papers.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) ||
                    p.about.toLowerCase().includes(searchTerm)
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;color:var(--text-light)">No papers found</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(paper => `
                <tr>
                    <td><strong>${paper.name}</strong></td>
                    <td>${paper.about}</td>
                    <td class="link-cell" onclick="window.open('${paper.link}', '_blank')">Open ↗</td>
                    <td>
                        <button class="icon-btn" onclick="editPaper(${paper.id})">Edit</button>
                        <button class="icon-btn" onclick="deletePaper(${paper.id})">Del</button>
                    </td>
                </tr>
            `).join('');
        }

        function exportData() {
            const json = JSON.stringify(papers, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'research-papers-' + new Date().toISOString().split('T')[0] + '.json';
            a.click();
            showStatus('✓ Exported');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTable(e.target.value.toLowerCase());
        });

        loadData();
    </script>
</body>
</html>
