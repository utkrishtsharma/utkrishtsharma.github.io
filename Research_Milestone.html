<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Library - E-Paper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #e8e5d8;
            --paper: #f5f3eb;
            --text: #2a2825;
            --text-light: #6a6865;
            --border: #c8c5b8;
            --accent: #4a4845;
            --shadow: rgba(0, 0, 0, 0.08);
            --glass: rgba(255, 255, 255, 0.6);
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            position: relative;
        }

        .main-panel {
            flex: 1;
            background: var(--paper);
            border: 2px solid var(--border);
            box-shadow: 4px 4px 0 var(--shadow);
            padding: 30px;
        }

        header {
            border-bottom: 3px double var(--border);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 0.9rem;
            font-style: italic;
        }

        .top-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid var(--border);
            background: white;
            font-family: inherit;
            font-size: 0.95rem;
            box-shadow: inset 2px 2px 0 var(--shadow);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            padding: 12px 25px;
            border: 2px solid var(--accent);
            background: var(--paper);
            color: var(--accent);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            background: var(--accent);
            color: var(--paper);
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 var(--shadow);
        }

        .btn:active {
            transform: translate(0, 0);
            box-shadow: 2px 2px 0 var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 2px solid var(--border);
        }

        th {
            background: var(--accent);
            color: var(--paper);
            padding: 12px 15px;
            text-align: left;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            border: 2px solid var(--accent);
        }

        td {
            padding: 12px 15px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }

        tr:nth-child(even) {
            background: var(--paper);
        }

        tr:hover {
            background: #fff8e8;
        }

        .link-cell {
            color: #2563eb;
            text-decoration: underline;
            cursor: pointer;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            padding: 5px 10px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
        }

        .icon-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .news-widget {
            width: 320px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .widget-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
        }

        .widget-controls {
            display: flex;
            gap: 5px;
        }

        .control-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .tags-input {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .news-content {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .news-item {
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 0.85rem;
        }

        .news-item-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--accent);
        }

        .news-item-source {
            color: var(--text-light);
            font-size: 0.75rem;
            margin-bottom: 5px;
        }

        .news-item-desc {
            color: var(--text);
            line-height: 1.4;
        }

        .widget-minimized {
            height: 60px;
            overflow: hidden;
        }

        .widget-minimized .news-content,
        .widget-minimized .tags-input {
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            padding: 40px;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--paper);
            border: 3px solid var(--border);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 8px 8px 0 var(--shadow);
        }

        .modal-header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border);
            background: white;
            font-family: inherit;
            font-size: 0.9rem;
            box-shadow: inset 2px 2px 0 var(--shadow);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
            }
            
            .news-widget {
                width: 100%;
                position: relative;
                top: 0;
                max-height: 400px;
            }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-panel">
            <header>
                <h1>Research Archive</h1>
                <p class="subtitle">Personal Knowledge Repository</p>
            </header>

            <div class="top-bar">
                <input type="text" class="search-input" id="searchInput" placeholder="Search papers...">
                <button class="btn" onclick="openModal()">+ Add</button>
            </div>

            <div id="tableContainer">
                <table id="papersTable">
                    <thead>
                        <tr>
                            <th style="width: 30%">Name</th>
                            <th style="width: 45%">About</th>
                            <th style="width: 15%">Link</th>
                            <th style="width: 10%">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="papersBody"></tbody>
                </table>
            </div>
        </div>

        <div class="news-widget" id="newsWidget">
            <div class="widget-header">
                <span class="widget-title">Research Feed</span>
                <div class="widget-controls">
                    <button class="control-btn" onclick="toggleWidget()" title="Minimize">_</button>
                </div>
            </div>
            <input type="text" class="tags-input" id="tagsInput" placeholder="Add tags: AI, ML, quantum...">
            <div class="news-content" id="newsContent">
                <div class="news-item">
                    <div class="news-item-title">Getting Started</div>
                    <div class="news-item-source">System</div>
                    <div class="news-item-desc">Add research tags above to track latest developments from trusted sources.</div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Research Paper</h2>
            </div>
            <form id="paperForm" onsubmit="savePaper(event)">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="paperName" required>
                </div>
                <div class="form-group">
                    <label>About</label>
                    <textarea id="paperAbout" required></textarea>
                </div>
                <div class="form-group">
                    <label>Link</label>
                    <input type="url" id="paperLink" placeholder="https://" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const DATA_KEY = 'r3s34rch_d4t4';
        let papers = [];
        let editingId = null;

        // Simple XOR encryption with obfuscated key
        function encode(str) {
            const k = 'R\u200B3\u200Bs\u200B34\u200BRch\u200BK3y\u200B2024'.replace(/\u200B/g, '');
            let result = '';
            for (let i = 0; i < str.length; i++) {
                result += String.fromCharCode(str.charCodeAt(i) ^ k.charCodeAt(i % k.length));
            }
            return btoa(result);
        }

        function decode(str) {
            const k = 'R\u200B3\u200Bs\u200B34\u200BRch\u200BK3y\u200B2024'.replace(/\u200B/g, '');
            let decoded = atob(str);
            let result = '';
            for (let i = 0; i < decoded.length; i++) {
                result += String.fromCharCode(decoded.charCodeAt(i) ^ k.charCodeAt(i % k.length));
            }
            return result;
        }

        function loadData() {
            try {
                const encrypted = localStorage.getItem(DATA_KEY);
                if (encrypted) {
                    papers = JSON.parse(decode(encrypted));
                }
            } catch (e) {
                papers = [];
            }
            renderTable();
        }

        function saveData() {
            const encrypted = encode(JSON.stringify(papers));
            localStorage.setItem(DATA_KEY, encrypted);
        }

        function openModal(id = null) {
            const modal = document.getElementById('addModal');
            
            if (id) {
                editingId = id;
                const paper = papers.find(p => p.id === id);
                document.getElementById('modalTitle').textContent = 'Edit Research Paper';
                document.getElementById('paperName').value = paper.name;
                document.getElementById('paperAbout').value = paper.about;
                document.getElementById('paperLink').value = paper.link;
            } else {
                editingId = null;
                document.getElementById('modalTitle').textContent = 'Add Research Paper';
                document.getElementById('paperForm').reset();
            }
            
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('paperForm').reset();
            editingId = null;
        }

        function savePaper(event) {
            event.preventDefault();
            
            const paper = {
                id: editingId || Date.now(),
                name: document.getElementById('paperName').value,
                about: document.getElementById('paperAbout').value,
                link: document.getElementById('paperLink').value,
                dateAdded: editingId ? papers.find(p => p.id === editingId).dateAdded : new Date().toISOString()
            };

            if (editingId) {
                const index = papers.findIndex(p => p.id === editingId);
                papers[index] = paper;
            } else {
                papers.unshift(paper);
            }

            saveData();
            renderTable();
            closeModal();
        }

        function deletePaper(id) {
            if (confirm('Delete this paper?')) {
                papers = papers.filter(p => p.id !== id);
                saveData();
                renderTable();
            }
        }

        function renderTable(searchTerm = '') {
            const tbody = document.getElementById('papersBody');
            let filtered = papers;

            if (searchTerm) {
                filtered = papers.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) ||
                    p.about.toLowerCase().includes(searchTerm)
                );
            }

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No papers found. Add your first research paper!</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(paper => `
                <tr>
                    <td><strong>${paper.name}</strong></td>
                    <td>${paper.about}</td>
                    <td class="link-cell" onclick="window.open('${paper.link}', '_blank')">Open ↗</td>
                    <td>
                        <div class="actions">
                            <button class="icon-btn" onclick="openModal(${paper.id})">Edit</button>
                            <button class="icon-btn" onclick="deletePaper(${paper.id})">Del</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderTable(e.target.value.toLowerCase());
        });

        document.getElementById('addModal').addEventListener('click', (e) => {
            if (e.target.id === 'addModal') closeModal();
        });

        function toggleWidget() {
            const widget = document.getElementById('newsWidget');
            widget.classList.toggle('widget-minimized');
        }

        // Simulate news feed (static demo)
        document.getElementById('tagsInput').addEventListener('change', (e) => {
            const tags = e.target.value.split(',').map(t => t.trim()).filter(t => t);
            const newsContent = document.getElementById('newsContent');
            
            if (tags.length > 0) {
                newsContent.innerHTML = tags.map(tag => `
                    <div class="news-item">
                        <div class="news-item-title">Latest in ${tag}</div>
                        <div class="news-item-source">Research Feed</div>
                        <div class="news-item-desc">Tracking developments in ${tag}. Add papers manually to build your collection.</div>
                    </div>
                `).join('');
            }
        });

        loadData();
    </script>
</body>
</html>
