<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Library - Academic Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #ffffff;
            --hover-glass: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 300;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: 300;
        }

        .btn:hover {
            background: var(--hover-glass);
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 0.7rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .view-toggle {
            display: flex;
            gap: 0.5rem;
        }

        .filter-bar {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .filter-bar::-webkit-scrollbar {
            height: 4px;
        }

        .filter-bar::-webkit-scrollbar-track {
            background: var(--glass-bg);
        }

        .filter-bar::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 2px;
        }

        .filter-chip {
            padding: 0.5rem 1rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-weight: 300;
        }

        .filter-chip:hover,
        .filter-chip.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .papers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .papers-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .paper-card {
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .paper-card:hover {
            background: var(--hover-glass);
            transform: translateY(-2px);
        }

        .paper-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .paper-card:hover::before {
            opacity: 1;
        }

        .paper-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.8rem;
        }

        .paper-title {
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .paper-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .paper-category {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 0.75rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .paper-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .icon-btn {
            padding: 0.4rem 0.8rem;
            background: transparent;
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            padding: 2rem;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 300;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.7rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .papers-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Research Library</h1>
            <p class="subtitle">Your Personal Academic Knowledge Base</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search papers, authors, keywords...">
            </div>
            <button class="btn btn-primary" onclick="openModal()">+ Add Paper</button>
            <div class="view-toggle">
                <button class="btn" onclick="toggleView('grid')" id="gridViewBtn">Grid</button>
                <button class="btn" onclick="toggleView('list')" id="listViewBtn">List</button>
            </div>
        </div>

        <div class="filter-bar" id="filterBar">
            <div class="filter-chip active" data-category="all">All</div>
        </div>

        <div id="papersContainer" class="papers-grid"></div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2 id="modalTitle">Add Research Paper</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="paperForm" onsubmit="savePaper(event)">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="paperTitle" required>
                </div>
                <div class="form-group">
                    <label>Authors</label>
                    <input type="text" id="paperAuthors" placeholder="Separate with commas">
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <input type="number" id="paperYear" min="1900" max="2100">
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="paperCategory" required>
                        <option value="">Select category</option>
                        <option value="Machine Learning">Machine Learning</option>
                        <option value="Computer Vision">Computer Vision</option>
                        <option value="Natural Language Processing">Natural Language Processing</option>
                        <option value="Robotics">Robotics</option>
                        <option value="Theory">Theory</option>
                        <option value="Systems">Systems</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Subcategory</label>
                    <input type="text" id="paperSubcategory" placeholder="e.g., Deep Learning, CNNs">
                </div>
                <div class="form-group">
                    <label>Link/URL *</label>
                    <input type="url" id="paperLink" placeholder="https://" required>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="paperNotes" placeholder="Key insights, methodology, relevance..."></textarea>
                </div>
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let papers = [];
        let currentView = 'grid';
        let currentFilter = 'all';
        let editingId = null;

        // Load data from memory on page load
        function loadData() {
            papers = JSON.parse(localStorage.getItem('researchPapers') || '[]');
            renderPapers();
            updateFilterBar();
        }

        // Save data to memory
        function saveData() {
            localStorage.setItem('researchPapers', JSON.stringify(papers));
        }

        // Open modal for adding/editing
        function openModal(id = null) {
            const modal = document.getElementById('addModal');
            const form = document.getElementById('paperForm');
            
            if (id) {
                editingId = id;
                const paper = papers.find(p => p.id === id);
                document.getElementById('modalTitle').textContent = 'Edit Research Paper';
                document.getElementById('paperTitle').value = paper.title;
                document.getElementById('paperAuthors').value = paper.authors;
                document.getElementById('paperYear').value = paper.year;
                document.getElementById('paperCategory').value = paper.category;
                document.getElementById('paperSubcategory').value = paper.subcategory || '';
                document.getElementById('paperLink').value = paper.link;
                document.getElementById('paperNotes').value = paper.notes || '';
            } else {
                editingId = null;
                document.getElementById('modalTitle').textContent = 'Add Research Paper';
                form.reset();
            }
            
            modal.classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('paperForm').reset();
            editingId = null;
        }

        // Save paper
        function savePaper(event) {
            event.preventDefault();
            
            const paper = {
                id: editingId || Date.now(),
                title: document.getElementById('paperTitle').value,
                authors: document.getElementById('paperAuthors').value,
                year: document.getElementById('paperYear').value,
                category: document.getElementById('paperCategory').value,
                subcategory: document.getElementById('paperSubcategory').value,
                link: document.getElementById('paperLink').value,
                notes: document.getElementById('paperNotes').value,
                dateAdded: editingId ? papers.find(p => p.id === editingId).dateAdded : new Date().toISOString()
            };

            if (editingId) {
                const index = papers.findIndex(p => p.id === editingId);
                papers[index] = paper;
            } else {
                papers.unshift(paper);
            }

            saveData();
            renderPapers();
            updateFilterBar();
            closeModal();
        }

        // Delete paper
        function deletePaper(id) {
            if (confirm('Are you sure you want to delete this paper?')) {
                papers = papers.filter(p => p.id !== id);
                saveData();
                renderPapers();
                updateFilterBar();
            }
        }

        // Toggle view
        function toggleView(view) {
            currentView = view;
            const container = document.getElementById('papersContainer');
            container.className = view === 'grid' ? 'papers-grid' : 'papers-list';
            
            document.getElementById('gridViewBtn').style.background = view === 'grid' ? 'var(--hover-glass)' : '';
            document.getElementById('listViewBtn').style.background = view === 'list' ? 'var(--hover-glass)' : '';
        }

        // Filter papers
        function filterPapers(category) {
            currentFilter = category;
            renderPapers();
            
            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.classList.toggle('active', chip.dataset.category === category);
            });
        }

        // Update filter bar
        function updateFilterBar() {
            const categories = new Set(papers.map(p => p.category));
            const filterBar = document.getElementById('filterBar');
            
            filterBar.innerHTML = '<div class="filter-chip active" data-category="all" onclick="filterPapers(\'all\')">All</div>';
            
            categories.forEach(category => {
                if (category) {
                    filterBar.innerHTML += `
                        <div class="filter-chip" data-category="${category}" onclick="filterPapers('${category}')">
                            ${category}
                        </div>
                    `;
                }
            });
        }

        // Search papers
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderPapers(e.target.value.toLowerCase());
        });

        // Render papers
        function renderPapers(searchTerm = '') {
            const container = document.getElementById('papersContainer');
            let filtered = papers;

            // Apply category filter
            if (currentFilter !== 'all') {
                filtered = filtered.filter(p => p.category === currentFilter);
            }

            // Apply search filter
            if (searchTerm) {
                filtered = filtered.filter(p => 
                    p.title.toLowerCase().includes(searchTerm) ||
                    p.authors.toLowerCase().includes(searchTerm) ||
                    p.category.toLowerCase().includes(searchTerm) ||
                    (p.subcategory && p.subcategory.toLowerCase().includes(searchTerm)) ||
                    (p.notes && p.notes.toLowerCase().includes(searchTerm))
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No papers found</h3>
                        <p>Start building your research library by adding papers</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(paper => `
                <div class="paper-card glass">
                    <div class="paper-header">
                        <div style="flex: 1;">
                            <h3 class="paper-title">${paper.title}</h3>
                            <div class="paper-meta">
                                ${paper.authors ? `${paper.authors}` : ''}
                                ${paper.year ? ` · ${paper.year}` : ''}
                            </div>
                            <div>
                                <span class="paper-category">${paper.category}</span>
                                ${paper.subcategory ? `<span class="paper-category">${paper.subcategory}</span>` : ''}
                            </div>
                            ${paper.notes ? `<p style="margin-top: 0.8rem; font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5;">${paper.notes.substring(0, 150)}${paper.notes.length > 150 ? '...' : ''}</p>` : ''}
                        </div>
                    </div>
                    <div class="paper-actions">
                        <button class="icon-btn" onclick="window.open('${paper.link}', '_blank')">Open</button>
                        <button class="icon-btn" onclick="openModal(${paper.id})">Edit</button>
                        <button class="icon-btn" onclick="deletePaper(${paper.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Close modal on outside click
        document.getElementById('addModal').addEventListener('click', (e) => {
            if (e.target.id === 'addModal') {
                closeModal();
            }
        });

        // Initialize
        loadData();
    </script>
</body>
</html>
